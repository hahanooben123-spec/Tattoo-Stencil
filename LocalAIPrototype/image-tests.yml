name: StencilImageChecks
options:
  bundleIdPrefix: dk.stencilstudio.tests
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
targets:
  StencilImageTools:
    type: framework
    platform: iOS
    sources:
      - Sources/LocalAIImages.swift
      - Sources/LocalAIError.swift
  StencilImageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: StencilImageTools
schemes:
  StencilImageChecks:
    build:
      targets:
        StencilImageTools: all
    test:
      targets: [StencilImageTests]
