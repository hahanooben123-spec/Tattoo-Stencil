name: StencilLocalAI
options:
  bundleIdPrefix: dk.stencilstudio
  deploymentTarget:
    iOS: '17.0'
packages:
  MediaGenerationKit:
    url: https://github.com/drawthingsai/media-generation-kit.git
    revision: 8868a9685d9c299816f43ef53efd455ffca437f0
targets:
  StencilLocalAI:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - path: Resources
    dependencies:
      - package: MediaGenerationKit
        product: MediaGenerationKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.stencilstudio.localprototype
        PRODUCT_NAME: StencilLocalAI
        TARGETED_DEVICE_FAMILY: '2'
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stencil Lokal AI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_ENTITLEMENTS: LocalAI.entitlements
        SWIFT_OPTIMIZATION_LEVEL: '-O'
    scheme:
      gatherCoverageData: false
      testTargets: [StencilLocalAITests]
  StencilLocalAITests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: StencilLocalAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
