name: Local stencil server
on:
  push:
    paths: ['LocalStencilServer/**', '.github/workflows/local-stencil-server.yml']
  pull_request:
    paths: ['LocalStencilServer/**', '.github/workflows/local-stencil-server.yml']
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No model, CUDA download or private reference image is needed for API tests.
      - run: python -m pip install -c LocalStencilServer/requirements.txt fastapi httpx pytest pillow
      - run: python -m pytest LocalStencilServer/tests -q
