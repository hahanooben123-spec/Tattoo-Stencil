name: Local AI iPad prototype
on:
  push:
    paths: ['LocalAIPrototype/**', '.github/workflows/local-ai-ipad.yml']
  pull_request:
    paths: ['LocalAIPrototype/**', '.github/workflows/local-ai-ipad.yml']
jobs:
  image-geometry:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test image geometry and black pixels on iOS Simulator
        run: |
          brew install xcodegen
          xcodegen generate --spec LocalAIPrototype/image-tests.yml
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPad" in x["name"]))')
          xcodebuild -project LocalAIPrototype/StencilImageChecks.xcodeproj -scheme StencilImageChecks \
            -destination "platform=iOS Simulator,id=$device" CODE_SIGNING_ALLOWED=NO test
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec LocalAIPrototype/project.yml
      - uses: actions/cache/restore@v4
        with:
          path: .build/local-ai
          key: ipad-ai-${{ runner.os }}-8868a968-${{ github.sha }}
          restore-keys: ipad-ai-${{ runner.os }}-8868a968-
      - name: Build real local engine for iPad
        run: |
          set -o pipefail
          mkdir -p .build
          xcodebuild -project LocalAIPrototype/StencilLocalAI.xcodeproj -scheme StencilLocalAI \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build/local-ai -clonedSourcePackagesDirPath .build/local-ai/SourcePackages \
            CODE_SIGNING_ALLOWED=NO build > .build/local-ai-build.log 2>&1 || {
              tail -180 .build/local-ai-build.log; exit 1;
            }
      - name: Package unsigned app for review
        run: |
          mkdir -p .build/local-ai-package/Payload
          cp -R .build/local-ai/Build/Products/Release-iphoneos/StencilLocalAI.app .build/local-ai-package/Payload/
          cd .build/local-ai-package
          ditto -c -k --sequesterRsrc --keepParent Payload StencilLocalAI-unsigned.ipa
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .build/local-ai
          key: ipad-ai-${{ runner.os }}-8868a968-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-ai-ipad-build
          path: |
            .build/local-ai-build.log
            .build/local-ai-package/StencilLocalAI-unsigned.ipa
          retention-days: 14
